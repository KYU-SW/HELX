<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  ============================================================
  Supabase 설정 안내
  ============================================================
  1) supabase.com 에서 무료 프로젝트를 생성하세요.
  2) 아래 SQL을 Supabase SQL 에디터에서 실행해 테이블을 만드세요.
  3) 아래 <script> 안의 SUPABASE_URL / SUPABASE_ANON_KEY 값을
     본인 프로젝트의 Project URL / anon public key로 바꿔주세요.
  4) 이 파일은 외부 네트워크 요청(Supabase 포함)이 필요하므로,
     Netlify, Vercel 같은 본인 소유의 정적 호스팅에 올려서 사용하세요.
  5) 이 앱은 "아이디"로 로그인하도록 되어 있어요. 내부적으로는
     아이디를 가짜 이메일(아이디@hlex.local)로 변환해 Supabase Auth에
     넘기기 때문에, Authentication > Providers > Email 메뉴에서
     "Confirm email" 옵션을 반드시 꺼두세요. (실제로 받을 수 없는
     주소라 인증 메일이 전달되지 않습니다.)

  create table profiles (
    id uuid references auth.users primary key,
    username text unique,
    onboarded boolean default false,
    behaviors text[],
    primary_behavior text,
    situations text[],
    goal text,
    created_at timestamptz default now()
  );

  create table records (
    id uuid primary key,
    user_id uuid references auth.users not null,
    ts timestamptz not null,
    behavior text, activity text, feeling text, intensity int,
    aware_timing text
  );

  ※ 이미 records 테이블을 만들어 두었다면 아래 한 줄만 실행하세요:
  alter table records add column aware_timing text;

  create table experiments (
    id uuid primary key,
    user_id uuid references auth.users not null,
    ts timestamptz not null,
    behavior text, feeling text, method text,
    before_val int, after_val int, feedback text
  );

  create table prevention_sessions (
    id uuid primary key,
    user_id uuid references auth.users not null,
    ts timestamptz not null,
    situation text, occurred text
  );

  alter table profiles enable row level security;
  alter table records enable row level security;
  alter table experiments enable row level security;
  alter table prevention_sessions enable row level security;

  create policy "own profile" on profiles for all using (auth.uid() = id);
  create policy "own records" on records for all using (auth.uid() = user_id);
  create policy "own experiments" on experiments for all using (auth.uid() = user_id);
  create policy "own prevention" on prevention_sessions for all using (auth.uid() = user_id);
  ============================================================
-->
<style>

<script>
/* ---------------------------- SUPABASE CLIENT ---------------------------- */
// Publishable key는 브라우저에 공개돼도 안전한 키예요. 데이터 보호는 Row Level Security가 담당해요.
// 주의: Secret key(service_role)는 절대 이 파일에 넣지 마세요.
const SUPABASE_URL = 'https://gabqryvgtmhtlsmjfclc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_broW5ulFlcvw8pRT67rupA_om7OyACR';
const sb = (typeof supabase !== 'undefined' && SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('YOUR_'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
}

/* ---------------------------- DATA LAYER ---------------------------- */
const DEFAULT_DATA = () => ({
  onboarded: false,
  username: '',
  behaviors: [],
  primaryBehavior: '',
  situations: [],
  goal: '',
  records: [],
  experiments: [],
  preventionSessions: []
});

let DATA = null;
let CURRENT_USER = null; // { id, email }

async function checkSession(){
  if(!sb) return null;
  const { data: { session } } = await sb.auth.getSession();
  return session ? session.user : null;
}

async function loadData(){
  if(!sb || !CURRENT_USER){ DATA = DEFAULT_DATA(); return; }
  DATA = DEFAULT_DATA();
  try{
    const [{ data: profile }, { data: records }, { data: experiments }, { data: prevention }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', CURRENT_USER.id).maybeSingle(),
      sb.from('records').select('*').eq('user_id', CURRENT_USER.id).order('ts'),
      sb.from('experiments').select('*').eq('user_id', CURRENT_USER.id).order('ts'),
      sb.from('prevention_sessions').select('*').eq('user_id', CURRENT_USER.id).order('ts')
    ]);
    if(profile){
      DATA.onboarded = !!profile.onboarded;
      DATA.username = profile.username || '';
      DATA.behaviors = profile.behaviors || [];
      DATA.primaryBehavior = profile.primary_behavior || '';
      DATA.situations = profile.situations || [];
      DATA.goal = profile.goal || '';
    }
    DATA.records = (records||[]).map(r => ({ id:r.id, ts:new Date(r.ts).getTime(), behavior:r.behavior, activity:r.activity, feeling:r.feeling, intensity:r.intensity, awareTiming:r.aware_timing || '' }));
    DATA.experiments = (experiments||[]).map(e => ({ id:e.id, ts:new Date(e.ts).getTime(), behavior:e.behavior, feeling:e.feeling, method:e.method, before:e.before_val, after:e.after_val, feedback:e.feedback }));
    DATA.preventionSessions = (prevention||[]).map(p => ({ id:p.id, ts:new Date(p.ts).getTime(), situation:p.situation, occurred:p.occurred }));
  }catch(e){
    console.error('load failed', e);
  }
}

async function saveProfile(){
  if(!sb || !CURRENT_USER) return;
  try{
    await sb.from('profiles').upsert({
      id: CURRENT_USER.id,
      username: DATA.username,
      onboarded: DATA.onboarded,
      behaviors: DATA.behaviors,
      primary_behavior: DATA.primaryBehavior,
      situations: DATA.situations,
      goal: DATA.goal
    });
  }catch(e){ console.error('profile save failed', e); }
}
async function insertRecord(rec){
  if(!sb || !CURRENT_USER) return;
  const row = {
    id: rec.id, user_id: CURRENT_USER.id, ts: new Date(rec.ts).toISOString(),
    behavior: rec.behavior, activity: rec.activity, feeling: rec.feeling, intensity: rec.intensity,
    aware_timing: rec.awareTiming || null
  };
  try{
    let { error } = await sb.from('records').insert(row);
    // aware_timing 컬럼을 아직 추가하지 않았다면, 컬럼 없이 다시 저장해서 기록이 사라지지 않게 함
    if(error && /aware_timing/.test(error.message || '')){
      delete row.aware_timing;
      ({ error } = await sb.from('records').insert(row));
    }
    if(error) console.error('record insert failed', error);
  }catch(e){ console.error('record insert failed', e); }
}
async function updateRecordField(id, field, value){
  if(!sb || !CURRENT_USER) return;
  const col = field === 'awareTiming' ? 'aware_timing' : field;
  try{
    const { error } = await sb.from('records').update({ [col]: value }).eq('id', id).eq('user_id', CURRENT_USER.id);
    if(error) console.error('record update failed', error);
  }catch(e){ console.error('record update failed', e); }
}
async function insertExperiment(exp){
  if(!sb || !CURRENT_USER) return;
  try{
    await sb.from('experiments').insert({
      id: exp.id, user_id: CURRENT_USER.id, ts: new Date(exp.ts).toISOString(),
      behavior: exp.behavior, feeling: exp.feeling, method: exp.method,
      before_val: exp.before, after_val: exp.after, feedback: exp.feedback
    });
  }catch(e){ console.error('experiment insert failed', e); }
}
async function insertPrevention(p){
  if(!sb || !CURRENT_USER) return;
  try{
    await sb.from('prevention_sessions').insert({
      id: p.id, user_id: CURRENT_USER.id, ts: new Date(p.ts).toISOString(),
      situation: p.situation, occurred: p.occurred
    });
  }catch(e){ console.error('prevention insert failed', e); }
}
async function wipeAllData(){
  if(!sb || !CURRENT_USER) return;
  try{
    await Promise.all([
      sb.from('records').delete().eq('user_id', CURRENT_USER.id),
      sb.from('experiments').delete().eq('user_id', CURRENT_USER.id),
      sb.from('prevention_sessions').delete().eq('user_id', CURRENT_USER.id)
    ]);
    await sb.from('profiles').upsert({
      id: CURRENT_USER.id, onboarded:false, behaviors:[], primary_behavior:'', situations:[], goal:''
    });
  }catch(e){ console.error('wipe failed', e); }
}

/* ---------------------------- CONTENT MAPS ---------------------------- */
const BEHAVIORS = ['손톱 물어뜯기','손톱 주변 피부 뜯기','입술 뜯기','피부 뜯기','머리카락 만지기 또는 뽑기','기타 반복행동'];
const SITUATIONS = ['공부하거나 과제할 때','시험이나 발표 전','스마트폰을 볼 때','영상을 볼 때','잠들기 전','이동 중','혼자 있을 때','사람과 대화할 때','잘 모르겠음'];
const GOALS = [
  '일주일 동안 행동 패턴 3개 발견하기',
  '하루 한 번 행동을 알아차리기',
  '대체 행동을 일주일에 5번 시도하기',
  '행동 충동이 생겼을 때 10초 멈추기',
  '나에게 효과적인 대체 행동 2개 찾기'
];
const ACTIVITIES = ['공부','스마트폰','영상 시청','대화','휴식','이동','취침 준비'];
const AWARE_TIMINGS = ['하는 도중','끝난 직후','한참 뒤'];
// 대조 조건: 충동은 가만히 둬도 줄 수 있어서, 대체 행동의 효과를 비교하는 기준으로 사용
const CONTROL = {
  name: '아무것도 하지 않고 1분 기다리기',
  desc: '특별한 방법 없이 하던 일을 잠시 멈추고 1분 동안 기다려보세요. 충동이 저절로 얼마나 줄어드는지 확인하는 비교 기준이에요.',
  dur: 60,
  control: true
};
function isControl(name){ return name === CONTROL.name; }
const MIN_TRIES = 3; // 이 횟수 이상 시도해야 '효과적'이라고 표시
const FEELINGS = ['불안','스트레스','지루함','피곤함','집중','건조함 또는 거친 촉감','무의식적','잘 모르겠음'];

const METHODS = {
  '건조함 또는 거친 촉감': [
    {name:'립밤 바르고 물 한 모금 마시기', desc:'입술이 건조하면 충동이 더 강해져요. 손을 대는 대신 립밤과 물로 먼저 달래주세요.', dur:60},
    {name:'손톱 파일로 거친 부분 정리하기', desc:'신경 쓰이는 거친 부분을 안전하게 다듬어보세요.', dur:60}
  ],
  '불안': [
    {name:'양손 맞잡고 세 번 호흡하기', desc:'양손을 가볍게 맞잡고 천천히 세 번 숨을 들이쉬고 내쉬어보세요.', dur:45},
    {name:'짧은 호흡 4-4-4', desc:'4초 들이쉬고, 4초 멈추고, 4초 내쉬는 것을 세 번 반복해보세요.', dur:45}

const INTENSITY_COLORS = {1:'#4C8F5E', 2:'#8DA84A', 3:'#D1A93C', 4:'#D97F44', 5:'#C0503F'};
function intensityBtnStyle(n, selected){
  if(!selected) return '';
  return `style="background:${INTENSITY_COLORS[n]};border-color:${INTENSITY_COLORS[n]};color:#fff;"`;
}
function fmtTime(ts){
  const d = new Date(ts);
  const h = d.getHours();
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ampm} ${h12}시`;
}
function todayCount(list){
  const today = new Date(); today.setHours(0,0,0,0);
  return list.filter(r => r.ts >= today.getTime()).length;
}
function mostFrequent(arr){
  if(!arr.length) return null;
  const counts = {};
  arr.forEach(v => counts[v] = (counts[v]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
}
function hourBucketLabel(records){
  if(!records.length) return null;
  const hours = records.map(r => new Date(r.ts).getHours());
  const counts = {};
  hours.forEach(h => counts[h] = (counts[h]||0)+1);
  const topHour = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const h = parseInt(topHour,10);
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ampm} ${h12}시경`;
}
function bestMethod(experiments){
  if(!experiments.length) return null;
  const byMethod = {};
  experiments.forEach(e => {
    if(!byMethod[e.method]) byMethod[e.method] = {sum:0,count:0};
    byMethod[e.method].sum += (e.before - e.after);
    byMethod[e.method].count += 1;
  });
  const entries = Object.entries(byMethod).map(([m,v]) => ({method:m, avg: v.sum/v.count, count:v.count}));
  entries.sort((a,b)=>b.avg-a.avg);
  return entries[0];
}
function bestMethodForFeeling(experiments, feeling){
  const filtered = experiments.filter(e=>e.feeling===feeling);
  return bestMethod(filtered);
}
// 방법별 평균 충동 감소(전-후)와 시도 횟수
function methodStats(exps){
  const by = {};
  exps.forEach(e => {
    if(e.before == null || e.after == null) return;
    if(!by[e.method]) by[e.method] = {sum:0, count:0};
    by[e.method].sum += (e.before - e.after);
    by[e.method].count += 1;
  });
  return Object.entries(by).map(([method,v]) => ({method, avg: v.sum/v.count, count: v.count})).sort((a,b)=>b.avg-a.avg);
}
function controlBaseline(){
  const st = methodStats(DATA.experiments.filter(e => isControl(e.method)));
  return st[0] || null;
}
function fmtChange(avg){
  if(avg > 0) return `평균 ${avg.toFixed(1)}점 감소`;
  if(avg < 0) return `평균 ${Math.abs(avg).toFixed(1)}점 증가`;
  return '변화 없음';
}

// 추천 규칙:
// 1) 해당 느낌의 실험이 없으면 기본 방법
// 2) 3회 이상 시도해 효과가 확인된 방법이 없으면, 가장 덜 시도한 방법을 제안
// 3) 효과가 확인된 방법이 있어도 3번에 한 번은 덜 시도한 방법을 제안 (편향 방지)
// 4) 그 외에는 효과가 확인된 방법
function suggestMethod(feeling, opts){
  opts = opts || {};
  const pool = METHODS[feeling] || METHODS['잘 모르겠음'];
  const exps = DATA.experiments.filter(e => e.feeling === feeling);
  const stats = methodStats(exps);
  const countOf = name => (stats.find(x => x.method === name) || {count:0}).count;
  const withTag = (m, tag) => Object.assign({}, m, {tag});
  if(exps.length === 0) return withTag(pool[0], '');
  const candidates = (exps.length >= 2 && !opts.noControl) ? pool.concat([CONTROL]) : pool;
  const leastTried = candidates.slice().sort((a,b) => countOf(a.name) - countOf(b.name))[0];
  const qualified = stats.filter(x => x.count >= MIN_TRIES && x.avg > 0 && pool.some(m => m.name === x.method));
  if(qualified.length === 0) return withTag(leastTried, '더 시도해볼 방법');
  if(exps.length % 3 === 0 && countOf(leastTried.name) < MIN_TRIES) return withTag(leastTried, '덜 시도한 방법');
  return withTag(pool.find(m => m.name === qualified[0].method), '효과가 좋았던 방법');
}

function setAuthError(msg){
  const el = document.getElementById('auth-error');
  if(el) el.textContent = msg || '';
}

async function handleLogin(){
  if(!sb){ setAuthError('Supabase 연결 정보가 설정되지 않았어요.'); return; }
  const username = document.getElementById('login-username').value.trim();
  const pw = document.getElementById('login-pw').value;
  if(!username || !pw){ setAuthError('아이디와 비밀번호를 입력해주세요.'); return; }
  setAuthError('로그인 중…');
  const { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password: pw });
  if(error){ setAuthError('아이디 또는 비밀번호가 올바르지 않아요.'); return; }
  CURRENT_USER = data.user;
  await loadData();
  showToast('로그인했어요');
  go(DATA.onboarded ? 'home' : 'onboard-intro');
}

async function handleSignup(){
  if(!sb){ setAuthError('Supabase 연결 정보가 설정되지 않았어요.'); return; }
  const username = document.getElementById('signup-username').value.trim();
  const pw = document.getElementById('signup-pw').value;
  if(!isValidUsername(username)){ setAuthError('아이디는 영문/숫자/밑줄 3~20자로 입력해주세요.'); return; }
  if(pw.length < 6){ setAuthError('비밀번호는 6자 이상이어야 해요.'); return; }
  setAuthError('가입 처리 중…');
  const { data, error } = await sb.auth.signUp({ email: usernameToEmail(username), password: pw });
  if(error){
    setAuthError(error.message.includes('already') ? '이미 사용 중인 아이디예요.' : error.message);
    return;
  }
  if(!data.session){
    setAuthError('');
    showToast('가입 처리 중 문제가 있어요. Supabase에서 Confirm email 옵션을 꺼두었는지 확인해주세요.');
    go('auth-login');
    return;
  }
  CURRENT_USER = data.user;
  DATA = DEFAULT_DATA();
  DATA.username = username;
  await sb.from('profiles').upsert({ id: CURRENT_USER.id, username });
  go('onboard-intro');
}

async function handleLogout(){
  if(sb) await sb.auth.signOut();
  CURRENT_USER = null;
  DATA = DEFAULT_DATA();
  showToast('로그아웃했어요');
  go('auth-login');
}

/* ---- EFFECTS: 느낌별 효과 비교 ---- */
function renderEffects(){
  const exps = DATA.experiments.filter(e => e.before != null && e.after != null);
  const base = controlBaseline();
  const feelings = Array.from(new Set(exps.filter(e => !isControl(e.method)).map(e => e.feeling)));
  const baseCard = base
    ? `<div class="card-soft" style="margin-top:16px;">
        <p style="font-size:12.5px; color:var(--ink-soft);">비교 기준 · 아무것도 하지 않고 기다렸을 때</p>
        <p style="font-size:15px; font-weight:700; margin-top:4px;">${fmtChange(base.avg)} · ${base.count}회</p>
        ${base.count < MIN_TRIES ? `<p style="font-size:12px; color:var(--ink-soft); margin-top:4px;">기다리기 기록이 적어서 아래 비교는 참고용이에요.</p>` : ''}
       </div>`
    : `<div class="card-soft" style="margin-top:16px;">
        <p style="font-size:13px; line-height:1.7; color:var(--ink-soft);">기다리기 기록이 아직 없어요. 코치 화면의 '다른 방법 선택하기'에서 '아무것도 하지 않고 1분 기다리기'를 해보면, 다른 방법이 기다리는 것보다 더 도움이 되는지 비교할 수 있어요.</p>
       </div>`;
  const sections = feelings.map(f => {
    const stats = methodStats(exps.filter(e => e.feeling === f && !isControl(e.method)));
    return `
    <p style="font-size:14px; font-weight:700; margin-top:22px;">${f}</p>
    <div class="card" style="margin-top:8px;">
      ${stats.map(x => {
        const provisional = x.count < MIN_TRIES;
        const vs = base ? ` · 기다리기보다 ${Math.abs(x.avg - base.avg).toFixed(1)}점 ${x.avg - base.avg >= 0 ? '더 감소' : '덜 감소'}${(provisional || base.count < MIN_TRIES) ? ' (참고)' : ''}` : '';
        return `<div class="list-row" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <span class="v" style="max-width:100%; text-align:left;">${x.method}${provisional ? ' <span class="badge" style="margin-left:6px;">잠정</span>' : ''}</span>
          <span class="k">${fmtChange(x.avg)} · ${x.count}회${vs}</span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  return `
  <div class="topnav"><div class="backbtn" onclick="go('map')">‹</div></div>
  <h2 style="font-size:19px;">느낌별 효과 비교</h2>
  <p class="lede">같은 느낌에서 어떤 방법이 충동을 더 줄였는지 비교해요. ${MIN_TRIES}회 미만 시도한 방법은 '잠정'이에요.</p>
  ${baseCard}
  ${feelings.length ? sections : '<p style="font-size:13.5px; color:var(--ink-soft); margin-top:20px;">아직 비교할 실험 기록이 없어요.</p>'}
  <div style="height:30px;"></div>
  `;
}

function renderMap(){
  const hasData = DATA.records.length > 0;
  const timeLabel = hourBucketLabel(DATA.records);
  const topSituation = mostFrequent(DATA.records.map(r=>r.activity).filter(Boolean));
  const topFeeling = mostFrequent(DATA.records.map(r=>r.feeling).filter(Boolean));
  const mStats = methodStats(DATA.experiments.filter(e => !isControl(e.method)));
  const best = mStats.find(x => x.count >= MIN_TRIES) || mStats[0] || null;
  const bestProvisional = !!best && best.count < MIN_TRIES;
  const timed = DATA.records.filter(r=>r.awareTiming);
  const tc = {'하는 도중':0,'끝난 직후':0,'한참 뒤':0};
  timed.forEach(r=>{ if(tc[r.awareTiming]!==undefined) tc[r.awareTiming]++; });
  const sharePct = arr => arr.length ? Math.round(arr.filter(r=>r.awareTiming==='하는 도중').length/arr.length*100) : 0;
  let trendLine = '';
  if(timed.length >= 6){
    const half = Math.floor(timed.length/2);
    trendLine = `<p style="font-size:12px; color:var(--ink-soft); margin-top:8px;">하는 도중 알아차린 비율: 처음 ${half}건 ${sharePct(timed.slice(0,half))}% → 최근 ${timed.length-half}건 ${sharePct(timed.slice(half))}%</p>`;
  }
  const timingCard = timed.length === 0
    ? `<p style="font-size:14px; color:var(--ink-soft); margin-top:6px;">아직 알 수 없어요. 기록할 때 "언제 알아차렸나요?"에 답해보세요.</p>`
    : `<div style="margin-top:6px;">
        ${Object.entries(tc).map(([k,v])=>`<div class="list-row"><span class="k">${k}</span><span class="v">${v}회</span></div>`).join('')}
       </div>${trendLine}`;

  return withBottomNav(`
  <h2 style="font-size:19px; margin-top:6px;">나의 HLEX 지도</h2>
  <p class="lede">기록이 쌓일수록 나에게 맞는 패턴이 선명해져요.</p>

  ${!hasData ? `
    <div class="card-soft" style="margin-top:20px;">
      <p style="font-size:13.5px; color:var(--ink-soft);">아직 기록이 없어요. 홈 화면에서 알아차린 행동을 기록해보세요.</p>
    </div>
  ` : `
    <div class="stack gap-12" style="margin-top:18px;">
      <div class="card">
        <p style="font-size:12.5px; color:var(--ink-soft);">가장 자주 발생한 시간</p>
        <p style="font-size:16px; font-weight:700; margin-top:4px;">${timeLabel || '아직 알 수 없어요'}</p>
      </div>
      <div class="card">
        <p style="font-size:12.5px; color:var(--ink-soft);">가장 자주 나타난 상황</p>
        <p style="font-size:16px; font-weight:700; margin-top:4px;">${topSituation ? `${topSituation[0]} (${topSituation[1]}회)` : '아직 알 수 없어요'}</p>
      </div>
      <div class="card">
        <p style="font-size:12.5px; color:var(--ink-soft);">가장 자주 나타난 느낌</p>
        <p style="font-size:16px; font-weight:700; margin-top:4px;">${topFeeling ? `${topFeeling[0]} (${topFeeling[1]}회)` : '아직 알 수 없어요'}</p>
      </div>
      <div class="card">
        <p style="font-size:12.5px; color:var(--ink-soft);">알아차린 시점</p>
        ${timingCard}
      </div>
      <div class="card">
        <p style="font-size:12.5px; color:var(--ink-soft);">가장 효과가 좋았던 방법</p>
        <p style="font-size:16px; font-weight:700; margin-top:4px;">${best ? `${best.method}` : '아직 실험 기록이 없어요'}</p>
        ${best ? `<p style="font-size:12px; color:var(--ink-soft); margin-top:4px;">${fmtChange(best.avg)} · ${best.count}회 시도${bestProvisional ? ` · 잠정 (${MIN_TRIES}회 이상 시도하면 확정돼요)` : ''}</p>` : ''}
        ${DATA.experiments.length ? `<button class="btn btn-ghost" style="margin-top:12px; padding:11px 16px; font-size:14px;" onclick="go('effects')">느낌별 효과 비교 보기</button>` : ''}
      </div>
    </div>

    <div class="divider"></div>
    <p style="font-size:14px; font-weight:600;">최근 기록</p>
    <div class="card" style="margin-top:10px;">
      ${DATA.records.slice(-5).reverse().map(r => `
        <div class="list-row">
          <span class="k">${fmtTime(r.ts)}</span>
          <span class="v">${r.behavior}${r.feeling ? ' · '+r.feeling : ''}</span>
        </div>`).join('')}
    </div>
  `}
  `, 'map');
}

function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hlex-data.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('내보내기 파일을 다운로드했어요');
}

function confirmReset(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3 style="font-size:17px;">전체 데이터를 초기화할까요?</h3>
      <p class="lede" style="margin-top:10px;">모든 기록, 실험, 예방 모드 이력이 삭제돼요. 이 작업은 되돌릴 수 없어요.</p>
      <div class="stack gap-10" style="margin-top:20px;">
        <button class="btn btn-clay" onclick="doReset()">초기화하기</button>
        <button class="btn btn-text" onclick="this.closest('.modal-overlay').remove()">취소</button>
      </div>
    </div>`;
  document.getElementById('screen').appendChild(overlay);
}
async function doReset(){
  await wipeAllData();
  DATA = DEFAULT_DATA();
  document.querySelector('.modal-overlay')?.remove();
  showToast('초기화했어요');
  go('onboard-intro');
}

function showPrivacyModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3 style="font-size:17px;">개인정보 처리 안내</h3>
      <div class="stack gap-10" style="margin-top:14px; font-size:13px; color:var(--ink-soft); line-height:1.7;">
        <p>· 꼭 필요한 정보만 수집하며, 회원가입 없이 체험할 수 있어요.</p>
        <p>· 기록은 언제든 삭제하거나 전체 초기화할 수 있어요.</p>
        <p>· 사진은 기본적으로 기기 내에만 저장되며, 카메라 영상은 저장하지 않아요.</p>
        <p>· 원하실 때 내 기록을 파일로 내보낼 수 있어요.</p>
      </div>
      <button class="btn btn-text" style="margin-top:16px;" onclick="this.closest('.modal-overlay').remove()">닫기</button>
    </div>`;
  document.getElementById('screen').appendChild(overlay);
}

/* ---------------------------- BOOT ---------------------------- */
(async function boot(){
  if(!sb){
    // Supabase 설정이 안 돼 있으면 안내만 하고 로컬 빈 데이터로 진행
    DATA = DEFAULT_DATA();
    ROUTE = 'onboard-intro';
    render();
    console.warn('SUPABASE_URL / SUPABASE_ANON_KEY를 설정해주세요. 지금은 로그인 없이 데모만 볼 수 있어요.');
    return;
  }
  CURRENT_USER = await checkSession();
  if(!CURRENT_USER){
    ROUTE = 'auth-login';
    render();
    return;
  }
  await loadData();
  ROUTE = DATA.onboarded ? 'home' : 'onboard-intro';
  render();

  sb.auth.onAuthStateChange((event) => {
    if(event === 'SIGNED_OUT'){
      CURRENT_USER = null;
      DATA = DEFAULT_DATA();
      go('auth-login');
    }
  });
})();
</script>
